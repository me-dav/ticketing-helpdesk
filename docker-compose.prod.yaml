services:
  app:
    image: medavv/ticketing-app:latest
    container_name: ticketing-app
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      APP_ENV: local
      APP_KEY: base64:HGeuADEUrvnGDUj3vyi9BJ7OyMYdg3Nyk3MzSTQK/rA=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ticketing_db
      DB_USERNAME: postgres
      DB_PASSWORD: password

  postgres:
    image: postgres:16-alpine
    container_name: postgres-main
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  nginx:
    image: nginx:alpine
    container_name: ticketing-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

volumes:
  postgres_data: